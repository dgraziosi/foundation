name: verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Official postgres:16 does not ship vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: ci-verify
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://foundation:ci-verify@127.0.0.1:5432/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "FOUNDATION_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Create required extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto" \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: pnpm --filter @foundation/schema test
      - run: pnpm --filter @foundation/viewer test
      - run: bash scripts/skills-layout.test.sh
      - run: bash scripts/drift-read.test.sh
      - run: bash scripts/foundation-init.test.sh
      - run: bash scripts/mint-api-key.test.sh
      - run: pnpm --filter @foundation/viewer build
      - run: bash scripts/require-database-url.test.sh
      - run: pnpm --filter @foundation/server test
      - name: Stop CI Postgres so host initdb can bind 5432
        run: |
          while read -r id ports; do
            case "${ports}" in
              *5432*) docker stop "${id}" ;;
            esac
          done < <(docker ps --format '{{.ID}} {{.Ports}}')
      - name: Host Postgres 16 on PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector
          echo "/usr/lib/postgresql/16/bin" >> "${GITHUB_PATH}"
          export PATH="/usr/lib/postgresql/16/bin:${PATH}"
          sudo pg_ctlcluster 16 main stop || true
          command -v initdb
          command -v pg_ctl
          command -v psql
          test -f /usr/share/postgresql/16/extension/pgcrypto.control
          test -f /usr/share/postgresql/16/extension/unaccent.control
          test -f /usr/share/postgresql/16/extension/pg_trgm.control
          test -f /usr/share/postgresql/16/extension/vector.control
          echo "VERIFY_RUN_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
      - name: Launch throwaway vault
        run: .cursor/skills/verify-foundation/scripts/verify-foundation.sh launch
      - name: Doctor throwaway vault
        run: |
          evidence="$(.cursor/skills/verify-foundation/scripts/verify-foundation.sh evidence-dir)"
          mkdir -p -- "${evidence}"
          .cursor/skills/verify-foundation/scripts/verify-foundation.sh doctor | tee "${evidence}/doctor.log"
      - name: Prove Unlock and Home empty copy
        run: bash .cursor/skills/verify-foundation/scripts/verify-http-drive.sh
      - name: Prove MCP client round-trip
        run: bash .cursor/skills/verify-foundation/scripts/verify-mcp-drive.sh
      - name: Cleanup throwaway vault
        if: always()
        run: .cursor/skills/verify-foundation/scripts/verify-foundation.sh cleanup
