services:
  # Postgres data is uid 999. blobs/ stays 0700 for the server user (not world-writable).
  # uploads/ is 1777 (sticky drop-box) so a host user can write on typical Linux bind mounts.
  # After a real cluster exists, db-host-read grants the host user named POSIX ACL read.
  # Host-read is backup convenience: the app does not wait on that oneshot.
  db-init:
    image: pgvector/pgvector:pg16
    user: "0"
    volumes:
      - ${FOUNDATION_DATA:-./data}:/data
      - ./scripts/vault-data-dir.sh:/vault-data-dir.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        bash /vault-data-dir.sh prepare /data
        mkdir -p /data/postgres /data/blobs /data/uploads && chown -R 999:999 /data/postgres && chmod 0700 /data/blobs && chmod 1777 /data/uploads
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation
      POSTGRES_DB: foundation
    volumes:
      - ${FOUNDATION_DATA:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 5s
      retries: 10

  # After the official image chmod 00700 on PGDATA (that call zeros the ACL
  # mask). Host uid is the clone owner or FOUNDATION_HOST_UID, never 1000.
  # Grant soft-skips when the data dir cannot take a named ACL.
  db-host-read:
    image: alpine:3.21
    user: "0"
    environment:
      FOUNDATION_HOST_UID: ${FOUNDATION_HOST_UID:-}
      FOUNDATION_HOST_UID_PROBE: /host-uid-probe
    volumes:
      - ${FOUNDATION_DATA:-./data}:/data
      - ./scripts/vault-data-dir.sh:/vault-data-dir.sh:ro
      - ./docker-compose.yml:/host-uid-probe:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache acl bash >/dev/null && bash /vault-data-dir.sh grant /data
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        restart: true

  foundation:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOUNDATION_API_KEY: ${FOUNDATION_API_KEY:?Set FOUNDATION_API_KEY in .env (see .env.example)}
      DATABASE_URL: postgres://foundation:foundation@db:5432/foundation
      FOUNDATION_DATA: /data
      FOUNDATION_HOST_UID: ${FOUNDATION_HOST_UID:-}
      FOUNDATION_HOST_UID_PROBE: /host-uid-probe
      FOUNDATION_VAULT_DATA_DIR_HELPER: /vault-data-dir.sh
      PORT: "8787"
      HOST: "0.0.0.0"
      VIEW_PORT: "8788"
      VIEW_HOST: "0.0.0.0"
    volumes:
      - ${FOUNDATION_DATA:-./data}:/data
      - ./scripts/vault-data-dir.sh:/vault-data-dir.sh:ro
      - ./docker-compose.yml:/host-uid-probe:ro
    # MCP + health + agent blobs: host-only. Documented attach is 127.0.0.1:8787.
    # /view is a separate publish so another machine on this vault can open the window.
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
      - "${VIEW_PORT:-8788}:8788"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
