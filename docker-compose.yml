services:
  # Postgres data is uid 999. blobs/ stays 0700 for the server user (not world-writable).
  # uploads/ is 1777 (sticky drop-box) so a host user can write on typical Linux bind mounts.
  db-init:
    image: pgvector/pgvector:pg16
    user: "0"
    volumes:
      - ${FOUNDATION_DATA:-./data}:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - mkdir -p /data/postgres /data/blobs /data/uploads && chown -R 999:999 /data/postgres && chmod 0700 /data/blobs && chmod 1777 /data/uploads
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation
      POSTGRES_DB: foundation
    volumes:
      - ${FOUNDATION_DATA:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 5s
      retries: 10

  foundation:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOUNDATION_API_KEY: ${FOUNDATION_API_KEY:?Set FOUNDATION_API_KEY in .env (see .env.example)}
      DATABASE_URL: postgres://foundation:foundation@db:5432/foundation
      FOUNDATION_DATA: /data
      PORT: "8787"
    volumes:
      - ${FOUNDATION_DATA:-./data}:/data
    # Published so /view works from another machine on this vault.
    # /mcp and /blobs stay loopback-only in the process (Host is not isolation).
    ports:
      - "${PORT:-8787}:8787"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
